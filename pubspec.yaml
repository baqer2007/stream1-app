name: onebr_tv
description: "ONEBR TV - Streaming & Media Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.2.0
  video_player: ^2.8.2
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  carousel_slider: ^5.0.0
  url_launcher: ^6.2.5
  flutter_downloader: ^1.11.6
  path_provider: ^2.1.2

  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.0
  android_intent_plus: ^5.0.2
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0

  package_info_plus: ^8.1.0
  cached_network_image: ^3.3.1
  wakelock_plus: ^1.2.8
  html: ^0.15.4

  # New features: clip/share + external subtitles
  file_picker: ^10.3.3
  share_plus: 11.1.0
  ffmpeg_kit_flutter_new_https: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 23
